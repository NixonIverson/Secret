<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Secret Briefcase</title>
<style>
:root{--ease:cubic-bezier(.65,.05,.25,1);--paper:#fbf4e4;--env:#e8c9a0;--env-dark:#cfa877;--flap:#f1d8b3;--wax:#9e1f2e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Georgia,"Times New Roman",serif;color:#fdf1e3;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#1d1438 0%,#4a2760 40%,#b04a74 76%,#ee9a72 100%)}
.glow{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;will-change:transform;animation:drift 20s ease-in-out infinite alternate}
.g1{width:50vmax;height:50vmax;background:#ff8fb0;left:-15vmax;top:-10vmax}
.g2{width:44vmax;height:44vmax;background:#6f4fd0;right:-12vmax;bottom:-14vmax;animation-duration:26s}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}
.stars{position:fixed;inset:0;pointer-events:none;animation:tw 4s ease-in-out infinite alternate;
  background-image:radial-gradient(1.5px 1.5px at 12% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 14%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 62%,#fff,transparent),radial-gradient(1px 1px at 55% 35%,#fff,transparent),radial-gradient(1px 1px at 6% 85%,#fff,transparent)}
@keyframes tw{from{opacity:.3}to{opacity:.95}}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 1.4rem);z-index:20;text-align:center;margin:0;padding:0 1rem;font-size:1.1rem;transition:opacity .5s ease}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1.5rem;padding:4.5rem 1rem 2rem;
  opacity:0;pointer-events:none;scale:.92;transition:opacity .9s ease,scale 1.1s var(--ease)}
.scene.on{opacity:1;pointer-events:auto;scale:1}
button{font:inherit;color:inherit}
/* ---- briefcase ---- */
.case{position:relative;width:min(80vw,440px);aspect-ratio:4/3;perspective:1400px}
.inside{position:absolute;inset:0;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,#7a1d3a,#3b0c20);box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 30px 60px rgba(20,5,35,.55);
  display:flex;align-items:center;justify-content:space-around;padding:0 6%}
.lid{position:absolute;inset:0;border-radius:14px;transform-origin:top center;background:linear-gradient(145deg,#7b4a2b,#4d2a15);
  box-shadow:0 30px 60px rgba(20,5,35,.55);transition:transform 1.5s var(--ease),opacity .6s ease 1.1s;will-change:transform}
.lid::before{content:"";position:absolute;inset:4%;border:2px dashed rgba(240,200,140,.35);border-radius:10px}
.lid::after{content:"";position:absolute;left:50%;top:-9%;width:34%;height:12%;translate:-50% 0;border:9px solid #3a1e0e;border-bottom:0;border-radius:22px 22px 0 0}
.dials{position:absolute;left:50%;top:50%;translate:-50% -50%;display:flex;gap:.6rem;padding:.7rem 1rem;border-radius:12px;background:#2c170b;box-shadow:inset 0 2px 8px #000,0 0 0 3px #d7a95a}
.dial{display:flex;flex-direction:column;align-items:center}
.dial button{background:none;border:0;cursor:pointer;font-size:1.1rem;padding:.2rem .6rem;opacity:.8}
.dial button:hover,.dial button:focus-visible{opacity:1;outline:0;color:#ffd98a}
.dial output{font:700 2rem/1.2 "Courier New",monospace;background:#f4e6c8;color:#2a170b;width:2.4rem;text-align:center;border-radius:5px}
.latch{position:absolute;bottom:14%;width:12%;height:9%;background:linear-gradient(#f0cb7a,#b5873a);border-radius:4px;box-shadow:0 2px 4px #0006;transition:transform .5s ease}
.latch.l{left:8%}.latch.r{right:8%}
.case.unlocked .latch{transform:translateY(-8px) rotate(var(--r,0))}
.case.unlocked .lid{transform:rotateX(100deg);opacity:0}
.note{width:150px;padding:1rem .9rem 1.2rem;background:#fff0a0;color:#3a2f10;rotate:4deg;box-shadow:0 10px 20px rgba(0,0,0,.35);text-align:center;font:1.05rem/1.4 "Comic Sans MS","Bradley Hand",cursive;transition:opacity .8s,translate .8s}
.note b{display:block;font:700 1.8rem "Courier New",monospace;letter-spacing:.2em;margin-top:.3rem}
.note.gone{opacity:0;translate:0 20px}
/* ---- inside: box + scissors ---- */
.sc{font-size:clamp(2.6rem,10vw,3.8rem);background:none;border:0;cursor:pointer;transition:scale .3s ease,filter .3s ease;rotate:-35deg;padding:0;visibility:hidden;opacity:0}
.case.unlocked .sc,.case.unlocked .box{visibility:visible;opacity:1;transition:opacity .6s ease .9s}
.box{visibility:hidden;opacity:0}
.sc.sel{scale:1.25;filter:drop-shadow(0 0 12px #ffd98a)}
.sc.snip{animation:snip .3s ease-in-out 4}
@keyframes snip{50%{scale:1.4;rotate:-60deg}}
.box{position:relative;width:46%;aspect-ratio:5/4;perspective:700px;cursor:pointer}
.in-env{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(3rem,12vw,4.5rem);scale:.6;transition:scale 1s var(--ease) .3s}
.half{position:absolute;left:0;right:0;height:50%;background:linear-gradient(#c89a63,#b98a54);box-shadow:inset 0 0 0 2px #0002;transition:transform 1s var(--ease);z-index:2}
.h1{top:0;transform-origin:top;border-radius:6px 6px 0 0}.h2{bottom:0;transform-origin:bottom;border-radius:0 0 6px 6px}
.tape{position:absolute;left:-2%;right:-2%;top:42%;height:16%;z-index:3;display:flex}
.tape i{flex:1;background:rgba(245,230,190,.92);box-shadow:0 1px 3px #0004;transition:transform .8s var(--ease),opacity .6s ease}
.shake{animation:shake .4s}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
.box.cut .t1{transform:translateX(-40%) rotate(-10deg);opacity:0}.box.cut .t2{transform:translateX(40%) rotate(10deg);opacity:0}
.box.cut .h1{transform:rotateX(115deg)}.box.cut .h2{transform:rotateX(-115deg)}
.box.cut .in-env{scale:1.15}
/* ---- envelope ---- */
.stage{position:relative;width:min(86vw,540px);aspect-ratio:3/2;cursor:pointer;perspective:1600px;transition:transform 1.4s var(--ease);animation:float 4s ease-in-out infinite;will-change:transform}
@keyframes float{50%{translate:0 -8px}}
.stage:focus-visible{outline:3px solid #fff;outline-offset:12px;border-radius:10px}
.envelope{position:absolute;inset:0;transform-style:preserve-3d}
.back{position:absolute;inset:0;background:var(--env-dark);border-radius:10px;box-shadow:0 40px 70px rgba(30,10,50,.5)}
.letter{position:absolute;left:6%;right:6%;top:7%;height:86%;z-index:2;border-radius:5px;background:var(--paper);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.25);will-change:transform;transition:transform 1.3s var(--ease) .8s,box-shadow 1s ease;
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(150,110,70,.13) 31px 32px)}
.letter span{font-size:clamp(5rem,26vw,10rem);line-height:1;display:block;opacity:0;transform:scale(.3) rotate(-12deg);filter:drop-shadow(0 6px 6px #0004);
  transition:transform 1s cubic-bezier(.34,1.56,.64,1) 2.1s,opacity .4s ease 2.1s}
.pocket{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:10px;
  background:linear-gradient(to bottom right,transparent 49.5%,var(--env) 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,var(--env) 50%) right/50% 100% no-repeat}
.pocket::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58%;background:var(--env);border-radius:0 0 10px 10px;clip-path:polygon(0 100%,0 0,50% 64%,100% 0,100% 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:top center;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform 1s var(--ease) .15s,z-index 0s .6s;will-change:transform}
.ribbon{position:absolute;left:0;right:0;top:46%;height:7%;z-index:5;background:linear-gradient(#222,#000);box-shadow:0 2px 4px #0006;transition:opacity .5s ease}
.ribbon.v{left:46.5%;right:auto;top:0;bottom:0;width:7%;height:auto}
.seal{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:1;z-index:6;border-radius:50%;translate:-50% -50%;
  background:radial-gradient(circle at 35% 30%,#c8394b,var(--wax));box-shadow:0 5px 10px rgba(0,0,0,.45);display:grid;place-items:center;font-size:clamp(1rem,5vw,1.8rem);transition:opacity .4s ease,scale .6s var(--ease)}
.stage.open .seal{opacity:0;scale:1.6}.stage.open .ribbon{opacity:0}
.stage.open .flap{transform:rotateX(180deg);z-index:1}
.stage.open .letter{transform:translateY(-64%)}
.stage.open .letter span{opacity:1;transform:none}
.stage.open{animation:none;transform:translateY(12%)}
.stage.out{transform:translateY(30%)}
.stage.out .letter{z-index:7;transform:translateY(-76%) scale(1.12);box-shadow:0 30px 60px rgba(0,0,0,.45);transition-delay:0s}
.again{position:fixed;z-index:20;bottom:calc(1.6rem + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.5);padding:.55rem 1.4rem;border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s ease}
.again.show{opacity:1;pointer-events:auto}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="stars"></div>
<p id="hint"></p>

<section class="scene on" id="s1">
  <div class="case" id="case">
    <div class="inside">
      <button class="sc" id="sc" aria-label="Pick up the scissors">✂️</button>
      <div class="box" id="box" role="button" tabindex="0" aria-label="Taped cardboard box">
        <div class="in-env">💌</div>
        <div class="half h1"></div><div class="half h2"></div>
        <div class="tape" id="tape"><i class="t1"></i><i class="t2"></i></div>
      </div>
    </div>
    <div class="lid">
      <div class="latch l"></div><div class="latch r"></div>
      <div class="dials" id="dials"></div>
    </div>
  </div>
  <div class="note" id="note">Psst. The code is<b id="code"></b></div>
</section>

<section class="scene" id="s2">
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Break the seal and open the envelope">
    <div class="envelope">
      <div class="back"></div>
      <div class="letter" aria-hidden="true"><span>💩</span></div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="ribbon"></div><div class="ribbon v"></div>
      <div class="seal">🔒</div>
    </div>
  </div>
</section>
<button class="again" id="again">Start over</button>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var hint=$('hint'),cs=$('case'),box=$('box'),sc=$('sc'),stage=$('stage'),again=$('again');
  var code,vals,busy;
  function say(t){hint.style.opacity=0;setTimeout(function(){hint.textContent=t;hint.style.opacity=.92},300)}
  function build(){
    var d=$('dials');d.innerHTML='';
    for(var i=0;i<3;i++){(function(i){
      var w=document.createElement('div');w.className='dial';
      w.innerHTML='<button aria-label="Digit '+(i+1)+' up">▲</button><output>0</output><button aria-label="Digit '+(i+1)+' down">▼</button>';
      var o=w.querySelector('output'),b=w.querySelectorAll('button');
      function step(n){if(busy)return;vals[i]=(vals[i]+n+10)%10;o.textContent=vals[i];if(vals.join('')===code)unlock()}
      b[0].onclick=function(){step(1)};b[1].onclick=function(){step(-1)};
      d.appendChild(w)})(i)}
  }
  function reset(){
    code='';for(var i=0;i<3;i++)code+=Math.floor(Math.random()*10);
    vals=[0,0,0];busy=false;$('code').textContent=code;
    cs.classList.remove('unlocked');$('note').classList.remove('gone');
    box.classList.remove('cut');sc.classList.remove('sel','snip');sc.style.translate='';sc.style.opacity='';
    stage.classList.remove('open','out');again.classList.remove('show');
    $('s2').classList.remove('on');$('s1').classList.add('on');build();
    say('Someone left a briefcase here. Use the note to open it.');
  }
  function unlock(){
    busy=true;cs.classList.add('unlocked');$('note').classList.add('gone');
    setTimeout(function(){busy=false;say('Inside is a taped box. Pick up the scissors, then cut the tape.')},1500);
  }
  sc.onclick=function(){if(!cs.classList.contains('unlocked')||busy)return;sc.classList.toggle('sel');say(sc.classList.contains('sel')?'Now tap the tape on the box.':'Pick up the scissors, then cut the tape.')};
  function cut(){
    if(!cs.classList.contains('unlocked')||busy||box.classList.contains('cut'))return;
    if(!sc.classList.contains('sel')){box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');say('The tape won’t budge. You need the scissors.');return}
    busy=true;
    var a=sc.getBoundingClientRect(),t=$('tape').getBoundingClientRect();
    sc.style.translate=(t.left+t.width/2-a.left-a.width/2)+'px '+(t.top+t.height/2-a.top-a.height/2)+'px';
    setTimeout(function(){sc.classList.add('snip')},700);
    setTimeout(function(){box.classList.add('cut');sc.style.opacity=0;say('')},1900);
    setTimeout(function(){$('s1').classList.remove('on');$('s2').classList.add('on');busy=false;say('A sealed envelope. Tap it to break the seal.');again.classList.add('show')},3600);
  }
  box.onclick=cut;box.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();cut()}};
  function openEnv(){
    if(stage.classList.contains('open'))return;
    stage.classList.add('open');say('');
    setTimeout(function(){stage.classList.add('out')},2300);
  }
  stage.onclick=openEnv;stage.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openEnv()}};
  again.onclick=reset;
  reset();
})();
</script>
</body>
</html>
